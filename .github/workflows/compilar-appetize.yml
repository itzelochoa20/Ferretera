# Compila la app para el simulador de iOS y genera el .zip para Appetize
name: Compilar para Appetize

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Compilar para el simulador
        run: |
          xcodebuild -version
          xcodebuild \
            -project FerreteraCD.xcodeproj \
            -target FerreteraCD \
            -sdk iphonesimulator \
            -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            build

      - name: Crear el .zip con el .app
        run: |
          cd build/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent FerreteraCD.app "$GITHUB_WORKSPACE/FerreteraCD-appetize.zip"

      - name: Guardar el resultado
        uses: actions/upload-artifact@v4
        with:
          name: FerreteraCD-appetize
          path: FerreteraCD-appetize.zip

  # Compila para un iPhone real (sin firmar) y genera el .ipa para Sideloadly
  ipa:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project FerreteraCD.xcodeproj \
            -target FerreteraCD \
            -sdk iphoneos \
            -configuration Release \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            build

      - name: Crear el .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/FerreteraCD.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload FerreteraCD.ipa

      - name: Guardar el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FerreteraCD-iphone-ipa
          path: FerreteraCD.ipa
